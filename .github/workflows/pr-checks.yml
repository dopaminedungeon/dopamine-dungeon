name: PR Checks

on:
  push:
    branches: [main, dev, 'release/**']
  pull_request:
    branches: [main, dev, 'release/**']

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trusted-quality-gate:
    name: DD Quality Gate
    runs-on: [self-hosted, macOS, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        run: corepack prepare pnpm@11.9.0 --activate

      - name: Show versions
        run: |
          node -v
          pnpm -v

      - name: Show pnpm config
        run: |
          pwd
          ls -la
          cat pnpm-workspace.yaml
          pnpm config get onlyBuiltDependencies

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        id: lint
        run: pnpm lint

      - name: Unit and domain tests
        id: unit
        if: always()
        run: pnpm test:unit

      - name: API integration tests
        id: api
        if: always()
        run: pnpm test:api

      - name: Boundary and security regression tests
        id: boundary
        if: always()
        run: pnpm test:boundary

      - name: API typecheck
        id: api_typecheck
        if: always()
        run: pnpm typecheck:api

      - name: E2E infrastructure typecheck
        id: e2e_typecheck
        if: always()
        run: pnpm typecheck:e2e

      - name: Production build
        id: build
        if: always()
        run: pnpm build

      - name: Playwright PR smoke (advisory)
        id: e2e_smoke
        if: always()
        continue-on-error: true
        run: pnpm test:e2e:smoke

      - name: Quality gate summary
        if: always()
        run: |
          {
            echo "## Dopamine Dungeon Quality Gate"
            echo ""
            echo "| Check | Result | Role |"
            echo "|---|---|---|"
            echo "| Lint | ${{ steps.lint.outcome }} | Blocking |"
            echo "| Unit/domain tests | ${{ steps.unit.outcome }} | Blocking |"
            echo "| API integration tests | ${{ steps.api.outcome }} | Blocking |"
            echo "| Boundary/security tests | ${{ steps.boundary.outcome }} | Blocking |"
            echo "| API typecheck | ${{ steps.api_typecheck.outcome }} | Blocking |"
            echo "| E2E typecheck | ${{ steps.e2e_typecheck.outcome }} | Blocking |"
            echo "| Production build | ${{ steps.build.outcome }} | Blocking |"
            echo "| Playwright PR smoke | ${{ steps.e2e_smoke.outcome }} | Advisory |"
          } >> "$GITHUB_STEP_SUMMARY"
